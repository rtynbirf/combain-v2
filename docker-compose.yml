name: combain

# ── COMBAIN v2 — self-hosted stack ─────────────────────────────────────────
# База:            docker compose up -d --build
# + TLS-прокси:    docker compose --profile tls up -d      (Caddy, авто-HTTPS)
# + бэкапы в S3:   docker compose --profile backup up -d   (Litestream)
# Требуется .env рядом с этим файлом (см. backend/.env.example):
#   JWT_SECRET, COMBAIN_DOMAIN, LITESTREAM_* — по профилям.

services:
  app:
    build: .
    image: ghcr.io/rtynbirf/combain-v2:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required (openssl rand -hex 32)}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-604800}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      AUTH_LIMIT_MAX: ${AUTH_LIMIT_MAX:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-http}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-52428800}
      ICE_SERVERS_JSON: ${ICE_SERVERS_JSON:-[{"urls":"stun:stun.l.google.com:19302"}]}
    volumes:
      - combain-data:/data
    ports:
      - "127.0.0.1:3000:3000"   # наружу только через Caddy; прямой доступ — localhost
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)throw 0}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Непрерывная репликация SQLite в S3-совместимое хранилище (point-in-time restore)
  backup:
    profiles: ["backup"]
    image: litestream/litestream:0.3
    restart: unless-stopped
    command: replicate -config /etc/litestream.yml
    environment:
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      - combain-data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    depends_on:
      app:
        condition: service_healthy

  # Обратный прокси с автоматическим Let's Encrypt TLS (включая WebSocket)
  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      COMBAIN_DOMAIN: ${COMBAIN_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  combain-data:
  caddy-data:
  caddy-config:
