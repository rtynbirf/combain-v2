name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # еженедельно, понедельник

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript)
    # Code scanning бесплатен для публичных репо (или с GHAS для приватных).
    # Репо станет публичным — анализ включится сам, без правок воркфлоу.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      actions: read # нужен codeql-action для get-a-workflow-run при загрузке SARIF
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410 # v3
        with:
          languages: javascript
          queries: security-extended
      - uses: github/codeql-action/autobuild@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410 # v3
      - uses: github/codeql-action/analyze@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410 # v3
        with:
          category: "/language:javascript"
