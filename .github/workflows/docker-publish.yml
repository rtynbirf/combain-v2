name: Publish Docker image (GHCR)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: мембрана реестра — старые версии образа прочь (квота хранилища Actions; урок nous 2026-11-10: 9 версий GHCR забили пул и покраснили релиз соседнего репо)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          pkg="${GITHUB_REPOSITORY#*/}"
          api="https://api.github.com/user/packages/container/${pkg}/versions?per_page=100"
          ids=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" "$api" \
            | jq -r --arg keep "${KEEP_TAG}" \
              '.[] | select((.metadata.container.tags // []) | index($keep) | not) | .id')
          for id in $ids; do
            curl -sf -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/user/packages/container/${pkg}/versions/${id}" \
              && echo "мембрана: удалена версия $id"
          done
