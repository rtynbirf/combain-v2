name: Publish Docker image (GHCR)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write     # SLSA: подпись провенанса OIDC-ключом рана
      attestations: write # SLSA: attestation в публичный transparency log
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: SLSA build provenance -> публичный transparency log
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/rtynbirf/combain-v2
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: "мембрана реестра — старые версии образа прочь (квота хранилища; урок nous 2026-11-10: 9 версий GHCR забили пул)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -uo pipefail
          pkg="${GITHUB_REPOSITORY#*/}"
          api="https://api.github.com/user/packages/container/${pkg}/versions?per_page=100"
          listing=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" "${api}") || { echo "мембрана: листинг недоступен — контур пройдёт в следующий такт"; exit 0; }
          fresh_cut=$(date -u -d '-1 hour' +%Y-%m-%dT%H:%M:%SZ)
          removed=0; survived=0
          while read -r id created; do
            [ -z "${id:-}" ] && continue
            # свежайшее не трогаем: теги GHCR доезжают с задержкой (race -> ложное безтеговое)
            if [[ "${created}" > "${fresh_cut}" ]]; then survived=$((survived+1)); continue; fi
            if curl -sf -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                 "https://api.github.com/user/packages/container/${pkg}/versions/${id}"; then
              echo "мембрана: удалена версия ${id}"; removed=$((removed+1))
            else
              echo "мембрана: версия ${id} пережила заход (занята/тег едет) — не краснит"; survived=$((survived+1))
            fi
          done < <(jq -r --arg keep "${KEEP_TAG}" \
            '.[] | select((.metadata.container.tags // []) | index($keep) | not) | "\(.id) \(.created_at)"' <<< "${listing}")
          echo "мембрана: удалено ${removed}, пережило ${survived} — контур закрыт"
