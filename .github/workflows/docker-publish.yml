name: Publish Docker image (GHCR)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: "мембрана реестра — старые версии образа прочь (квота хранилища Actions; урок nous 2026-11-10: 9 версий GHCR забили пул и покраснили релиз соседнего репо)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAG: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          pkg="${GITHUB_REPOSITORY#*/}"
          api="https://api.github.com/user/packages/container/${pkg}/versions?per_page=100"
          ids=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" "$api" \
            | jq -r --arg keep "${KEEP_TAG}" \
              '.[] | select((.metadata.container.tags // []) | index($keep) | not) | .id')
          for id in $ids; do
            curl -sf -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/user/packages/container/${pkg}/versions/${id}" \
              && echo "мембрана: удалена версия $id"
          done
