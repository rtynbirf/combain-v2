name: OSV-Scanner (зависимости против базы OSV)
# Скан зависимостей по OSV.dev — дополняет Dependabot (другие данные и покрытие).
# Пилот W8: report-only (fail-on-vuln=false) — находки в Security-табе, CI не красится.
# Реф osv-scanner-action v2.7.1 (2026-11-11) закреплён SHA, верифицирован живым GET.
on:
  push:
    branches: ["main"]
  schedule:
    - cron: '43 3 * * 6'  # еженедельно, суббота
  workflow_dispatch:

permissions: read-all

jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932
    with:
      fail-on-vuln: false
      upload-sarif: true
    permissions:
      contents: read
      security-events: write
